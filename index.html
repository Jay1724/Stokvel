<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mzansi AI — your everyday AI assistant, built for South Africa">
    <title>Mzansi AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <h2 class="section-title">Suggested for you</h2>

        <div class="chips-container" role="list" aria-label="Suggested prompts">
            <button class="chip" role="listitem" onclick="handleChipClick(this)">📝 Fix my CV for a retail or call-centre job</button>
            <button class="chip" role="listitem" onclick="handleChipClick(this)">🔥 Township side hustle ideas with R200</button>
            <button class="chip" role="listitem" onclick="handleChipClick(this)">🚌 Budget R400 for taxi, data, and lunch</button>
            <button class="chip" role="listitem" onclick="handleChipClick(this)">🎓 Motivation letter for NSFAS appeal</button>
            <button class="chip" role="listitem" onclick="handleChipClick(this)">🗣️ Turn formal English into Mzansi slang</button>
            <button class="chip" role="listitem" onclick="handleChipClick(this)">📚 Summarize Matric history exam chapters</button>
        </div>

        <div class="chat-input-area">
            <input
                class="chat-input"
                type="text"
                id="chatInput"
                placeholder="Ask me anything..."
                aria-label="Chat input"
                autocomplete="off"
            />
            <button class="send-btn" id="sendBtn" onclick="handleSend()" aria-label="Send message">➔</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
